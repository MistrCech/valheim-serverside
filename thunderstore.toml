# Thunderstore package of this plugin, built and published with `tcli` (github.com/thunderstore-io/thunderstore-cli):
#   tcli build                          builds dist/Sarkastic_gg-Dedicated_Simulation-<version>.zip
#   tcli publish --token <token>        uploads it (the token is a service account token of the team)
# The version is the plugin's (ServersidePlugin.cs); a package-only change (the icon) takes the next patch number.
# README.md carries a version badge: change it together with versionNumber.
# The description is at most 256 characters (Thunderstore answers 400 BadRequest to more).
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sarkastic_gg"
name = "Dedicated_Simulation"
versionNumber = "1.23.3"
description = "Server-side BepInEx plugin for Valheim dedicated servers: the server simulates the world itself. Character guard, item ledger, portal and ward guards, base decay, anti-cheat, fire control. Fork of Serverside Simulations by ddormer; clients stay vanilla."
websiteUrl = "https://github.com/MistrCech/valheim-serverside"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./bin/Release/SarkasticGG_Dedicated_Simulation.dll"
target = "plugins/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "./LICENSE"
target = "/"

[[build.copy]]
source = "./NOTICE.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "server-side", "tweaks", "deep-north-update" ]
